name: Glow Beauty website CI

permissions:
  contents: read
  pages: write
  id-token: write
  
on:
  push:
    branches:
      - main

jobs:
  check-website:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: check website file
        run: |
          test -f index.html
          test -f style.css

      - name: cCnfigure pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with: 
          path: .

  deploy:
    needs: check-website
    runs-on: ubuntu-latest
    permissions:
      pages: write 
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Github pages
        id: deployment
        uses: actions/deploy-pages@v4  

